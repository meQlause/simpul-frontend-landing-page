<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176448" />
    <meta
      name="description"
      content="Simpul makes sure important information does not get stuck between people. It sits on the chat your team already uses."
    />
    <title>Simpul — Busy conversations. Clear next steps.</title>
    <link rel="icon" type="image/png" href="/simpul-mark.png" />
    <!-- Critical loader styles stay inline so the first paint needs no downloaded asset. -->
    <style>
      html.page-loading:not(.page-revealing) {
        overflow: hidden;
      }
      html.page-loading {
        background: #f8f9f6;
      }
      .page-loading body {
        margin: 0;
      }
      .page-loading .skip-link {
        visibility: hidden;
      }
      .page-loading:not(.page-revealing) #smooth-wrapper {
        visibility: hidden;
      }
      #page-loader {
        display: none;
      }
      .page-loading #page-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f8f9f6;
        color: #163f32;
        font-family: 'Manrope Variable', 'Manrope', Arial, sans-serif;
      }
      .loader-wash {
        position: absolute;
        width: min(850px, 150vw);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, #edf4e7 0%, #f8f9f6 67%);
        pointer-events: none;
      }
      .loader-content {
        position: relative;
        width: min(360px, calc(100vw - 64px));
        text-align: center;
      }
      .loader-mark {
        width: 86px;
        height: 86px;
        margin: 0 auto 10px;
      }
      .loader-wordmark {
        margin: 0;
        font-size: 54px;
        font-weight: 650;
        letter-spacing: -3px;
        line-height: 1.1;
      }
      .loader-wordmark span {
        color: #71a977;
      }
      .loader-thread {
        display: block;
        width: 100%;
        height: 80px;
        margin: 26px 0 16px;
        overflow: visible;
      }
      .loader-thread path {
        fill: none;
        stroke-linecap: round;
        stroke-width: 1.4;
      }
      .loader-thread-track {
        stroke: #dae5d4;
      }
      .loader-thread-flow {
        stroke: #6a9658;
        stroke-dasharray: 0.12 0.88;
        animation: loader-flow 3s linear infinite;
      }
      .loader-caption {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        font:
          12px/1.5 'DM Sans Variable',
          Arial,
          sans-serif;
        color: #5d6f63;
      }
      #loader-status {
        margin: 0;
        text-align: left;
      }
      #loader-percent {
        font-variant-numeric: tabular-nums;
        color: #176448;
      }
      .loader-progress {
        height: 2px;
        margin-top: 13px;
        background: #dae5d4;
        overflow: hidden;
      }
      .loader-progress-fill {
        height: 100%;
        background: #176448;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 240ms ease-out;
      }
      .loader-foot {
        position: absolute;
        bottom: clamp(26px, 5vh, 52px);
        left: 24px;
        right: 24px;
        display: flex;
        justify-content: center;
        gap: 12px;
        align-items: center;
        color: #6a7e6a;
        font:
          10px/1.6 'DM Sans Variable',
          Arial,
          sans-serif;
        letter-spacing: 1.3px;
        text-transform: uppercase;
      }
      .loader-foot i {
        display: block;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #71a977;
      }
      #loader-retry {
        margin-top: 24px;
        padding: 10px 22px;
        color: #176448;
        background: transparent;
        border: 1px solid #b9cbb6;
        border-radius: 8px;
        font:
          13px/1.5 Arial,
          sans-serif;
        cursor: pointer;
      }
      #loader-retry:focus-visible {
        outline: 2px solid #176448;
        outline-offset: 4px;
      }
      @keyframes loader-flow {
        to {
          stroke-dashoffset: -1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-thread-flow {
          animation: none;
          stroke-dasharray: none;
        }
        .loader-progress-fill {
          transition: none;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .hero-boot .hero-lockup,
        .hero-boot .hero-heading-line,
        .hero-boot .hero-kicker,
        .hero-boot .hero-bottom,
        .hero-boot .hero-footer {
          visibility: hidden;
        }
      }
    </style>
    <script>
      document.documentElement.classList.add('page-loading');
      document.documentElement.dataset.pageReady = 'false';
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('hero-boot');
      }
      const loadingInput = new AbortController();
      const lockOptions = { capture: true, passive: false, signal: loadingInput.signal };
      const scrollKeys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '];
      const blockLoadingScroll = (event) => {
        if (event.type === 'keydown' && !scrollKeys.includes(event.key)) return;
        if (event.target instanceof Element && event.target.closest('#loader-retry')) return;
        event.preventDefault();
        event.stopImmediatePropagation();
      };
      ['wheel', 'touchmove', 'keydown'].forEach((type) =>
        window.addEventListener(type, blockLoadingScroll, lockOptions),
      );
      document.addEventListener('page-load-ready', () => loadingInput.abort(), { once: true });
      function loadingFailed() {
        if (document.documentElement.dataset.pageReady === 'true') return;
        const status = document.getElementById('loader-status');
        if (!status) {
          document.addEventListener('DOMContentLoaded', loadingFailed, { once: true });
          return;
        }
        status.textContent = 'The page could not finish loading.';
        document.getElementById('loader-retry').hidden = false;
      }
      document.addEventListener('page-load-error', loadingFailed);
      window.addEventListener(
        'error',
        (event) => {
          if (event.target instanceof HTMLScriptElement) loadingFailed();
        },
        true,
      );
      document.addEventListener('click', (event) => {
        if (event.target.closest('#loader-retry')) location.reload();
      });
      setTimeout(() => {
        if (document.documentElement.dataset.pageReady === 'true') return;
        document.getElementById('loader-status').textContent =
          'This is taking longer than expected.';
        document.getElementById('loader-retry').hidden = false;
      }, 30000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>

        </svg>
        <p class="loader-wordmark" aria-hidden="true">simpul<span>.</span></p>
        <svg class="loader-thread" viewBox="0 0 360 80" aria-hidden="true">
          <path
            class="loader-thread-track"
            pathLength="1"
            d="M0 40H100C132 40 142 12 166 12C197 12 213 68 184 68C153 68 167 40 204 40H360"
          />
          <path
            class="loader-thread-flow"
            pathLength="1"
            d="M0 40H100C132 40 142 12 166 12C197 12 213 68 184 68C153 68 167 40 204 40H360"
          />
        </svg>
        <div class="loader-caption">
          <p id="loader-status" role="status" aria-live="polite">Bringing it together</p>
          <span id="loader-percent" aria-hidden="true">0%</span>
        </div>
        <div
          class="loader-progress"
          role="progressbar"
          aria-label="Loading page"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="loader-progress-fill"></div>
        </div>
        <button id="loader-retry" type="button" hidden>Try again</button>
      </div>
      <div class="loader-foot" aria-hidden="true">
        <span>Busy conversations</span><i></i><span>Clear next steps</span>
      </div>
    </div>
    <a class="skip-link" href="#page">Skip to content</a>
    <!-- One scroll for the whole page: ScrollSmoother moves #smooth-content inside #smooth-wrapper,
         and every section's ScrollTrigger runs on that one clock. -->
    <div id="smooth-wrapper">
      <div id="smooth-content">
        <main id="page">
          <!-- React owns #sections only. The page's thread layer is added beside it, in #page. -->
          <div id="sections"><!--app-html--></div>
        </main>
      </div>
    </div>
    <script>
      document.getElementById('smooth-wrapper').inert = true;
    </script>
  </body>
</html>
